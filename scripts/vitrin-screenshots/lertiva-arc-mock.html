<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Lertiva Arc mock</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #eef2ff;
        padding: 24px;
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.12);
        padding: 20px 24px 28px;
      }
      h1 { margin: 0 0 4px; font-size: 1.5rem; }
      .meta { color: #64748b; margin: 0 0 12px; font-size: 0.9rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      button {
        padding: 7px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #f8fafc;
        font-size: 0.85rem;
      }
      button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
      .format-pills span {
        display: inline-block;
        padding: 4px 10px;
        margin-right: 6px;
        border-radius: 999px;
        font-size: 0.75rem;
        background: #eef2ff;
        color: #4338ca;
      }
      ul.entries {
        list-style: none;
        padding: 0;
        margin: 0;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
      }
      ul.entries li {
        padding: 6px 12px;
        border-bottom: 1px solid #f1f5f9;
        font-family: ui-monospace, monospace;
        font-size: 0.82rem;
      }
      .titlebar {
        height: 32px;
        background: linear-gradient(90deg, #312e81, #4f46e5);
        border-radius: 8px 8px 0 0;
        margin: -20px -24px 16px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 6px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.35); }
      .titlebar span { color: #e2e8f0; font-size: 12px; margin-left: 8px; }
      .status { margin-top: 12px; color: #059669; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span>Lertiva Arc v1.0.1</span>
      </div>
      <header>
        <h1>Lertiva Arc</h1>
        <p class="meta">Faz 2 · lertiva-archive · .wlrt + ZIP + RAR açma</p>
      </header>
      <div class="format-pills">
        <span>.wlrt</span><span>ZIP</span><span>RAR</span><span>7z</span>
      </div>
      <div class="toolbar">
        <button class="primary">Arşiv aç</button>
        <button>Çıkar</button>
        <button>Oluştur (.wlrt)</button>
        <button>Güvenli sihirbaz</button>
      </div>
      <ul class="entries">
        <li>rapor.wlrt</li>
        <li>yedek/part1.rar</li>
        <li>notlar/</li>
      </ul>
      <p class="status">Argon2id v2 · kurumsal denetim günlüğü</p>
    </div>
  </body>
</html>
