[package]
name = "winlrt-rar"
version = "0.1.0"
description = "winlrtRAR — Tauri kabuk"
authors = ["winlrt"]
edition = "2021"

[lib]
name = "winlrt_rar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
winlrt-archive = { path = "../../../crates/winlrt-archive" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
