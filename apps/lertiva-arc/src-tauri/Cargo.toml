[package]
name = "lertiva-arc"
version = "1.0.1"
description = "Lertiva Arc — Tauri kabuk"
authors = ["Lertiva"]
edition = "2021"

[lib]
name = "lertiva_arc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
unrar-embedded = ["lertiva-archive/unrar-embedded"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lertiva-archive = { path = "../../../crates/lertiva-archive" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }
