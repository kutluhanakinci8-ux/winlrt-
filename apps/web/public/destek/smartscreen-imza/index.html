<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartScreen &amp; kod imzası — Lertiva</title>
    <meta
      name="description"
      content="Microsoft Defender SmartScreen ve Authenticode hakkında bilgilendirme — Lertiva resmi sürüm; EV/OV imza planı ayrı izlek."
    />
    <link rel="icon" href="/favicon.svg?v=11" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=16" />
  </head>
  <body data-page-title-key="page.signing.title" data-meta-desc-key="page.signing.metaDescription">
    <div data-site-header></div>

    <section class="page-banner page-banner--signing">
      <div class="page-banner-bg" style="background-image: url(/assets/stock/feature-security.jpg)"></div>
      <div class="container">
        <span class="section-label" data-i18n="page.signing.label"></span>
        <h1 data-i18n="page.signing.h1"></h1>
        <p class="lead" data-i18n="page.signing.heroLead"></p>
        <p class="meta" style="margin-top: 1rem">
          <a href="#yasal-uyari" data-i18n="page.signing.legalJump"></a>
        </p>
        <div class="signing-trust-chips">
          <span class="signing-chip" data-i18n="page.signing.chip1"></span>
          <span class="signing-chip" data-i18n="page.signing.chip2"></span>
          <span class="signing-chip" data-i18n="page.signing.chip3"></span>
        </div>
      </div>
    </section>

    <main class="page-shell">
      <section class="section">
        <div class="container">
          <div class="section-head">
            <span class="section-label" data-i18n="page.signing.tracks.label"></span>
            <h2 data-i18n="page.signing.tracks.title"></h2>
            <p data-i18n="page.signing.tracks.lead"></p>
          </div>
          <div class="signing-track-grid">
            <article class="card signing-track-card signing-track-card--a">
              <span class="signing-track-badge" data-i18n="page.signing.trackA.badge"></span>
              <h3 data-i18n="page.signing.trackA.title"></h3>
              <p data-i18n="page.signing.trackA.body"></p>
              <ul class="signing-checklist meta">
                <li data-i18n="page.signing.trackA.l1"></li>
                <li data-i18n="page.signing.trackA.l2"></li>
                <li data-i18n="page.signing.trackA.l3"></li>
              </ul>
              <a class="btn btn-primary" href="/downloads/" data-i18n="page.signing.trackA.cta"></a>
            </article>
            <article class="card signing-track-card signing-track-card--b">
              <span class="signing-track-badge signing-track-badge--gold" data-i18n="page.signing.trackB.badge"></span>
              <p class="meta signing-track-planned" data-i18n="page.signing.trackB.planned"></p>
              <h3 data-i18n="page.signing.trackB.title"></h3>
              <p data-i18n="page.signing.trackB.body"></p>
              <ul class="signing-checklist meta">
                <li data-i18n="page.signing.trackB.l1"></li>
                <li data-i18n="page.signing.trackB.l2"></li>
                <li data-i18n="page.signing.trackB.l3"></li>
              </ul>
              <a class="btn btn-ghost" href="/benchmark/" data-i18n="page.signing.trackB.cta"></a>
            </article>
          </div>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container">
          <div class="feature-split">
            <div>
              <span class="section-label" data-i18n="page.signing.smartscreen.label"></span>
              <h2 data-i18n="page.signing.smartscreen.title"></h2>
              <p data-i18n="page.signing.smartscreen.body"></p>
              <p class="meta" data-i18n="page.signing.steps.note"></p>
              <ol class="signing-steps">
                <li>
                  <strong data-i18n="page.signing.step1.title"></strong>
                  <span data-i18n="page.signing.step1.body"></span>
                </li>
                <li>
                  <strong data-i18n="page.signing.step2.title"></strong>
                  <span data-i18n="page.signing.step2.body"></span>
                </li>
                <li>
                  <strong data-i18n="page.signing.step3.title"></strong>
                  <span data-i18n="page.signing.step3.body"></span>
                </li>
              </ol>
            </div>
            <figure class="signing-screenshot-wrap">
              <img
                src="/assets/gallery/smartscreen-lertiva.png"
                alt=""
                data-i18n-alt="page.signing.screenshot.alt"
                loading="lazy"
                width="640"
                height="400"
              />
              <figcaption class="about-media-caption">
                <span data-i18n="page.signing.screenshot.caption"></span>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <span class="section-label" data-i18n="page.signing.status.label"></span>
            <h2 data-i18n="page.signing.status.title"></h2>
            <p class="meta" id="signing-gate-meta" data-i18n="page.signing.status.loading"></p>
          </div>
          <article class="card signing-ev-banner" id="signing-ev-banner" hidden></article>
          <div class="signing-status-grid" id="signing-gate-grid"></div>
          <p class="meta" data-i18n="page.signing.status.disclaimer"></p>
          <p class="meta" style="margin-top: 1rem">
            <a href="/benchmark/samples/lertiva-windows-signing-gate.json" data-i18n="page.signing.status.json"></a>
            ·
            <a href="/benchmark/samples/lertiva-ev-ov-signing-gate.json" data-i18n="page.signing.status.evJson"></a>
            ·
            <a href="/downloads/#imza" data-i18n="page.signing.status.downloads"></a>
          </p>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container">
          <div class="trust-quote">
            <div>
              <span class="section-label" data-i18n="page.signing.it.label"></span>
              <h2 data-i18n="page.signing.it.title"></h2>
              <p data-i18n="page.signing.it.body"></p>
              <p style="margin-top: 1.25rem">
                <a href="/pilot/" data-i18n="nav.pilot"></a>
                ·
                <a href="/benchmark/corporate/" data-i18n="page.signing.link.corporate"></a>
                ·
                <a href="/guven/" data-i18n="nav.guven"></a>
              </p>
            </div>
            <img
              src="/assets/stock/hero-workspace.jpg"
              alt=""
              data-i18n-alt="page.signing.stock.workspaceAlt"
              loading="lazy"
            />
          </div>
          <p class="meta" style="margin-top: 1rem" data-i18n="page.signing.stockCredit"></p>
        </div>
      </section>

      <section class="section">
        <div class="container" style="max-width: 44rem">
          <h2 data-i18n="page.signing.faq.title"></h2>
          <div class="faq-list">
            <details>
              <summary data-i18n="page.signing.faq.q1"></summary>
              <p data-i18n="page.signing.faq.a1"></p>
            </details>
            <details>
              <summary data-i18n="page.signing.faq.q2"></summary>
              <p data-i18n="page.signing.faq.a2"></p>
            </details>
            <details>
              <summary data-i18n="page.signing.faq.q3"></summary>
              <p data-i18n="page.signing.faq.a3"></p>
            </details>
            <details>
              <summary data-i18n="page.signing.faq.q4"></summary>
              <p data-i18n="page.signing.faq.a4"></p>
            </details>
          </div>
        </div>
      </section>

      <section class="section section-alt" id="yasal-uyari">
        <div class="container legal-prose" style="max-width: 48rem">
          <span class="section-label" data-i18n="page.signing.legal.label"></span>
          <h2 data-i18n="page.signing.legal.title"></h2>
          <p data-i18n="page.signing.legal.p1"></p>
          <p data-i18n="page.signing.legal.p2"></p>
          <p data-i18n="page.signing.legal.p3"></p>
          <p data-i18n="page.signing.legal.p4"></p>
          <p class="meta">
            <a href="/kvkk/" data-i18n="nav.kvkk"></a>
            ·
            <a href="/iletisim/" data-i18n="nav.contact"></a>
            ·
            <a href="/guven/" data-i18n="nav.guven"></a>
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container" style="text-align: center; max-width: 40rem">
          <h2 data-i18n="page.signing.cta.title"></h2>
          <p data-i18n="page.signing.cta.body"></p>
          <p style="margin-top: 1.5rem">
            <a class="btn btn-primary" href="/iletisim/" data-i18n="nav.contact"></a>
            <a class="btn btn-ghost" href="/destek/" style="margin-left: 0.5rem" data-i18n="nav.drop.allSupport"></a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <script src="/js/header.js?v=11"></script>
    <script src="/js/footer.js?v=11"></script>
    <script src="/js/i18n.js?v=17"></script>
    <script src="/js/site.js?v=12"></script>
    <script src="/js/signing-page.js?v=1"></script>
