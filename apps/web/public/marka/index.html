<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marka kiti — Lertiva</title>
    <meta name="description" content="Lertiva logo, ürün ikonları ve kurumsal renkler." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=7" />
  </head>
  <body data-page-title-key="page.brand.title">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="logo" href="/">
          <img class="logo-img" src="/assets/logo-mark.svg" width="36" height="36" alt="" />
          Lertiva
        </a>
        <div class="header-tools">
          <button type="button" class="tool-btn" id="theme-toggle" aria-label="Tema">◐</button>
          <div class="lang-switch" role="group" aria-label="Dil">
            <button type="button" data-lang-btn="tr">TR</button>
            <button type="button" data-lang-btn="en">EN</button>
          </div>
        </div>
        <nav class="nav" id="main-nav" aria-label="Ana menü">
          <a href="/" data-i18n="nav.home">Ana sayfa</a>
          <a href="/downloads/" data-i18n="nav.download">İndir</a>
        </nav>
      </div>
    </header>
    <main class="container" style="padding: 3rem 0 4rem">
      <span class="section-label" data-i18n="nav.brand">Marka</span>
      <h1 data-i18n="page.brand.title">Marka kiti</h1>
      <p class="lead" data-i18n="page.brand.lead"></p>
      <div class="grid-2" style="margin-top: 2rem">
        <article class="card">
          <h3 data-i18n="page.brand.logo">Logo</h3>
          <p data-i18n="page.brand.logo.body"></p>
          <p style="margin-top: 1rem">
            <img src="/assets/logo-mark.svg" width="96" height="96" alt="" />
            <a href="/assets/logo-mark.svg" download style="margin-left: 1rem">logo-mark.svg</a>
            ·
            <a href="/assets/logo-full.svg" download>logo-full.svg</a>
          </p>
        </article>
        <article class="card">
          <h3 data-i18n="page.brand.products">Ürün ikonları</h3>
          <p data-i18n="page.brand.products.body"></p>
          <p style="margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center">
            <span>
              <img src="/assets/lertiva-zip-icon.svg" width="64" height="64" alt="" />
              <a href="/assets/lertiva-zip-icon.svg" download style="display: block; margin-top: 0.35rem"
                >lertiva-zip-icon.svg</a
              >
            </span>
            <span>
              <img src="/assets/lertiva-arc-icon.svg" width="64" height="64" alt="" />
              <a href="/assets/lertiva-arc-icon.svg" download style="display: block; margin-top: 0.35rem"
                >lertiva-arc-icon.svg</a
              >
            </span>
          </p>
        </article>
        <article class="card">
          <h3 data-i18n="page.brand.colors">Renkler</h3>
          <div class="brand-swatches">
            <div class="swatch">
              <div class="swatch-color" style="background: #2563eb"></div>
              <div class="swatch-label">Primary #2563eb</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: #1e3a5f"></div>
              <div class="swatch-label">Navy #1e3a5f</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: #c4a962"></div>
              <div class="swatch-label">Accent #c4a962</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: #0f172a"></div>
              <div class="swatch-label">Ink #0f172a</div>
            </div>
          </div>
          <p class="meta">Tipografi: Inter (gövde), Plus Jakarta Sans (başlık)</p>
        </article>
      </div>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="/js/footer.js?v=7"></script>
    <script src="/js/i18n.js?v=7"></script>
    <script src="/js/site.js?v=7"></script>
  </body>
</html>
