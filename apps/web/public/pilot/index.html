<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilot durumu — winlrt</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=5" />
  </head>
  <body data-page-title-key="page.pilot.title">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="logo" href="/">
          <img class="logo-img" src="/assets/logo-mark.svg" width="36" height="36" alt="" />
          Lertiva
        </a>
        <div class="header-tools">
          <button type="button" class="tool-btn" id="theme-toggle" aria-label="Tema">◐</button>
          <div class="lang-switch" role="group" aria-label="Dil">
            <button type="button" data-lang-btn="tr">TR</button>
            <button type="button" data-lang-btn="en">EN</button>
          </div>
        </div>
        <nav class="nav" id="main-nav" aria-label="Ana menü">
          <a href="/#durum" data-i18n="nav.status">Durum</a>
          <a href="/downloads/" data-i18n="nav.download">İndir</a>
          <a href="/benchmark/" data-i18n="nav.kpi">KPI</a>
          <a class="nav-cta nav-active" href="/pilot/" data-i18n="nav.pilot">Pilot</a>
        </nav>
      </div>
    </header>
    <main class="container" style="padding: 2rem 1rem 4rem">
      <span class="section-label" data-i18n="page.pilot.label">Pilot</span>
      <h1 data-i18n="page.pilot.h1">Lertiva Arc kabul dalgaları</h1>
      <p class="lead" id="lead" data-i18n="pilot.loading">Durum yükleniyor…</p>
      <p class="meta">
        <span data-i18n="page.pilot.kobiPrefix">Lertiva Zip KOBİ e-posta pilotu (W13) ayrı rehberdedir —</span>
        <a
          href="https://github.com/kutluhanakinci8-ux/winlrt-/blob/main/docs/qa/WINLRTZIP_KOBI_PILOT_KOPYA.md"
          data-i18n="page.pilot.kobiLink"
          >WINLRTZIP KOBİ pilot</a
        >.
        <a href="/#durum" data-i18n="page.pilot.statusTable">Ana vitrin durum tablosu.</a>
      </p>
      <div id="waves" style="display: grid; gap: 1rem; margin: 1.5rem 0"></div>
      <p class="meta" id="meta"></p>
      <p>
        <a class="btn btn-primary" id="beta-link" href="/downloads/" data-i18n="nav.download">İndir</a>
        <a class="btn btn-ghost" id="doc-link" href="#" data-i18n="pilot.btn.guide">Aktif dalga rehberi</a>
        <a
          class="btn btn-ghost"
          id="wave2-link"
          href="https://github.com/kutluhanakinci8-ux/winlrt-/blob/main/docs/qa/DALGA2_TEK_MESAJ.md"
          data-i18n="pilot.btn.wave2msg"
          >Dalga 2 — tek mesaj</a
        >
      </p>
    </main>
    <footer class="site-footer">
      <div class="container footer-bottom" style="border: none; padding-top: 0">
        <span data-i18n="footer.copy">© winlrt</span>
        <a href="/hakkimizda/" data-i18n="nav.about">Hakkımızda</a>
        <a href="/" data-i18n="nav.home">Ana sayfa</a>
      </div>
    </footer>
    <script src="/js/i18n.js"></script>
    <script src="/js/site.js"></script>
    <script>
      function pt(key) {
        return window.WinlrtSite ? WinlrtSite.t(key) : key;
      }

      function waveLabels() {
        return {
          1: pt("pilot.wave1"),
          2: pt("pilot.wave2"),
          3: pt("pilot.wave3"),
          4: pt("pilot.wave4"),
        };
      }

      function stateLabel(s) {
        if (s === "pass") return pt("pilot.state.pass");
        if (s === "pending") return pt("pilot.state.pending");
        return s;
      }

      async function loadPilot() {
        const labels = waveLabels();
        const res = await fetch("/pilot/status.json", { cache: "no-store" });
        const data = await res.json();
        const w = data.active_wave || 2;
        const blocker = data.blocker || "";
        const lead = document.getElementById("lead");
        lead.removeAttribute("data-i18n");
        lead.textContent =
          pt("pilot.leadPrefix") +
          " " +
          (labels[w] || w) +
          (blocker && blocker !== "none"
            ? " · " + pt("pilot.blockPrefix") + " " + blocker
            : "") +
          ". " +
          pt("pilot.afterTest");
        const root = document.getElementById("waves");
        const order = [
          ["2_explorer_qa", 2],
          ["3_corporate", 3],
          ["4_v1", 4],
        ];
        root.innerHTML = "";
        for (const [key, num] of order) {
          const st = (data.waves && data.waves[key]) || "pending";
          const active = num === w;
          root.insertAdjacentHTML(
            "beforeend",
            `<article class="card"><h3>${labels[num]}${
              active ? pt("pilot.activeNow") : ""
            }</h3><p class="meta">${pt("pilot.statusWord")}: <strong>${stateLabel(
              st
            )}</strong></p></article>`
          );
        }
        document.getElementById("meta").textContent =
          pt("pilot.updatedMeta") +
          " " +
          (data.generated_at || "") +
          " " +
          pt("pilot.updatedSuffix");
        if (data.links && data.links.beta_release) {
          document.getElementById("beta-link").href = data.links.beta_release;
        }
        const scripts = data.scripts || {};
        const scriptUrl =
          w === 2 ? scripts.dalga2 : w === 3 ? scripts.dalga3 : w === 4 ? scripts.dalga4 : null;
        if (scriptUrl) {
          root.insertAdjacentHTML(
            "beforeend",
            `<article class="card"><h3>${pt(
              "pilot.scriptTitle"
            )}</h3><p class="meta"><a href="${scriptUrl}">pilot-dalga${w}-start.ps1</a></p></article>`
          );
        }
        const doc =
          w === 3
            ? data.links.corporate_zip
            : w === 4
              ? "https://github.com/kutluhanakinci8-ux/winlrt-/blob/main/docs/qa/DALGA4_V1_OTURUM.md"
              : data.links.dalga2_doc;
        const a = document.getElementById("doc-link");
        a.href = doc;
        a.textContent =
          w === 3 ? pt("pilot.btn.corporateZip") : pt("pilot.btn.githubGuide");
      }

      loadPilot().catch(function () {
        const lead = document.getElementById("lead");
        lead.removeAttribute("data-i18n");
        lead.textContent = pt("pilot.loadError");
      });

      window.addEventListener("winlrt:lang", function () {
        loadPilot().catch(function () {});
      });
    </script>
  </body>
</html>
