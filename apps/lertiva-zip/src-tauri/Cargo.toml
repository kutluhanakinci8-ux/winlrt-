[package]
name = "lertiva-zip"
version = "0.1.0"
description = "Lertiva Zip — Tauri kabuk (ZIP odaklı)"
authors = ["Lertiva"]
edition = "2021"

[lib]
name = "lertiva_zip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lertiva-archive = { path = "../../../crates/lertiva-archive" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
