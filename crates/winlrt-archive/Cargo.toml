[package]
name = "winlrt-archive"
description = "winlrt arşiv motoru — winlrtRAR / winlrtZIP ortak çekirdek"
version.workspace = true
edition.workspace = true

[[bin]]
name = "winlrt-archive"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
zip.workspace = true
zstd.workspace = true
walkdir = "2"
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rar = "0.4.0"
sevenz-rust = { version = "0.6.1", default-features = false }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
regex = "1"
argon2 = "0.5"
unrar-ng = { version = "0.7.7", optional = true, default-features = false, features = [
  "linux-batch-extract-utf8",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[features]
default = []
unrar-embedded = ["dep:unrar-ng"]
