[package]
name = "winlrt-archive"
description = "winlrt arşiv motoru — winlrtRAR / winlrtZIP ortak çekirdek"
version.workspace = true
edition.workspace = true

[[bin]]
name = "winlrt-archive"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
zip.workspace = true
zstd.workspace = true
walkdir = "2"
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rar = "0.4.0"
sevenz-rust = { version = "0.6.1", default-features = false }

[dev-dependencies]
tempfile = "3"
