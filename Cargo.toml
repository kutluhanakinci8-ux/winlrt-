[workspace]
resolver = "2"
members = [
  "crates/winlrt-archive",
  "apps/winlrt-rar/src-tauri",
  "apps/winlrt-zip/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["winlrt"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "1"
zip = { version = "2", features = ["aes-crypto", "deflate", "time"] }
zstd = "0.12"
rayon = "1.10"
