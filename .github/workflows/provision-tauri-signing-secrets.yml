# Dev self-signed PFX → TAURI_SIGNING_* (GitHub Actions secrets).
# Önkoşul: repo secret LERTIVA_DEV_CODESIGN_PASSWORD (.github/signing/lertiva-dev-codesign.pfx.enc parolası).
name: Provision TAURI signing secrets (dev)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/signing/lertiva-dev-codesign.pfx.enc
      - .github/workflows/provision-tauri-signing-secrets.yml
      - .github/flags/trigger-provision-tauri-signing

permissions:
  contents: read
  actions: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Önkoşul — GITHUB_ADMIN_PAT (secrets API)
        env:
          ADMIN_PAT: ${{ secrets.GITHUB_ADMIN_PAT }}
        run: |
          if [ -z "${ADMIN_PAT}" ]; then
            echo "::error::Repo secret GITHUB_ADMIN_PAT gerekli (fine-grained: Actions secrets Read/Write)."
            exit 1
          fi

      - name: Önkoşul — LERTIVA_DEV_CODESIGN_PASSWORD
        env:
          ENC_PASS: ${{ secrets.LERTIVA_DEV_CODESIGN_PASSWORD }}
        run: |
          if [ -z "${ENC_PASS}" ]; then
            echo "::error::GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Ad: LERTIVA_DEV_CODESIGN_PASSWORD (dev PFX şifresi — bkz. .github/signing/README.md)"
            exit 1
          fi

      - name: PFX şifresini çöz
        env:
          ENC_PASS: ${{ secrets.LERTIVA_DEV_CODESIGN_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/signing/lertiva-dev-codesign.pfx.enc \
            -out /tmp/lertiva-dev-codesign.pfx \
            -pass env:ENC_PASS
          test -s /tmp/lertiva-dev-codesign.pfx

      - name: TAURI_SIGNING_* kaydet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ADMIN_PAT }}
          ENC_PASS: ${{ secrets.LERTIVA_DEV_CODESIGN_PASSWORD }}
        run: |
          base64 -w0 /tmp/lertiva-dev-codesign.pfx | gh secret set TAURI_SIGNING_PRIVATE_KEY --repo "${{ github.repository }}"
          printf '%s' "${ENC_PASS}" | gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD --repo "${{ github.repository }}"
          rm -f /tmp/lertiva-dev-codesign.pfx
          echo "OK: TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Secret adları (değer yok)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ADMIN_PAT }}
        run: gh secret list --repo "${{ github.repository }}"

  trigger-signed-builds:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows imzalı build tetikle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lertiva-zip-windows.yml --ref main -f skip_release=true
          gh workflow run lertiva-arc-windows.yml --ref main -f skip_release=true
