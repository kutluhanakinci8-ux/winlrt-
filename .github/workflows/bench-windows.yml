name: Lertiva Windows benchmark (resmi)

on:
  workflow_dispatch:
    inputs:
      kpi_strict:
        description: KPI kapısı geçmezse job başarısız (Faz 3 kapı doğrulama)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crates/lertiva-archive/**"
      - "benchmarks/**"
      - ".github/workflows/bench-windows.yml"
      - ".github/flags/trigger-windows-bench"

jobs:
  bench-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lertiva-archive

      - name: Install 7-Zip (rakip referans)
        run: choco install 7zip -y

      - name: Install WinRAR (rakip referans, deneme)
        continue-on-error: true
        run: choco install winrar -y

      - name: Build lertiva-archive
        run: cargo build -p lertiva-archive --release

      - name: Prepare mixed benchmark fixture (~10 MiB)
        shell: bash
        run: bash benchmarks/fixtures/mixed/prepare.sh

      - name: Benchmark (winlrt + 7-Zip + WinRAR ZIP + WinZip opsiyonel)
        env:
          WINLRT_BENCH_INCLUDE_7Z: "1"
          WINLRT_BENCH_INCLUDE_WINRAR: "1"
          WINLRT_BENCH_INCLUDE_WINZIP: "1"
        shell: pwsh
        run: |
          function Write-BenchJson {
            param([string[]]$CargoArgs, [string]$OutPath)
            cargo run -p lertiva-archive --release -- @CargoArgs 2>$null | Set-Content -Path $OutPath -Encoding utf8NoBOM
          }
          function Write-BenchMd {
            param([string[]]$CargoArgs, [string]$OutPath)
            cargo run -p lertiva-archive --release -- @CargoArgs 2>$null | Set-Content -Path $OutPath -Encoding utf8
          }
          Write-BenchJson -CargoArgs @('bench','--all','--json','--zip-kpi') -OutPath 'bench-report-windows.json'
          Write-BenchMd -CargoArgs @('bench','--all','--markdown') -OutPath 'BENCH_REPORT.md'
          Write-BenchJson -CargoArgs @('bench','--all','--profile','fast','--json','--zip-kpi') -OutPath 'bench-report-windows-fast.json'
          Write-BenchMd -CargoArgs @('bench','--all','--profile','fast','--markdown') -OutPath 'BENCH_REPORT_FAST.md'

      - name: KPI özeti — Balanced (strict kapı, Madde C)
        shell: pwsh
        env:
          WINLRT_KPI_STRICT: ${{ (vars.WINLRT_KPI_STRICT == '1' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.kpi_strict == true)) && '1' || '0' }}
        run: ./scripts/evaluate-bench-kpi.ps1 -JsonPath bench-report-windows.json

      - name: KPI özeti — Fast (rapor; hız kapısı izlenir)
        shell: pwsh
        env:
          WINLRT_KPI_STRICT: "0"
        run: ./scripts/evaluate-bench-kpi.ps1 -JsonPath bench-report-windows-fast.json -ReportOnly

      - name: Lertiva Zip KPI özeti (Madde W6 — ReportOnly)
        shell: pwsh
        run: |
          ./scripts/evaluate-bench-zip-kpi.ps1 -JsonPath bench-report-windows.json -ReportOnly
          ./scripts/evaluate-bench-zip-kpi.ps1 -JsonPath bench-report-windows-fast.json -ReportOnly

      - name: Lertiva Zip P0×3 özet (W16 artifact)
        shell: bash
        run: |
          chmod +x scripts/evaluate-lertiva-zip-p0-gate.sh
          ./scripts/evaluate-lertiva-zip-p0-gate.sh bench-report-windows.json bench-report-windows-fast.json vitrin-lertiva-zip-p0-gate.json

      - name: Lertiva Zip P0×3 strict (W16, WINLRT_KPI_STRICT=1)
        if: vars.WINLRT_KPI_STRICT == '1' || (github.event_name == 'workflow_dispatch' && inputs.kpi_strict == true)
        shell: pwsh
        run: |
          ./scripts/evaluate-bench-zip-kpi.ps1 -JsonPath bench-report-windows.json -Strict
          ./scripts/evaluate-bench-zip-kpi.ps1 -JsonPath bench-report-windows-fast.json -Strict
          WINLRT_ZIP_KPI_STRICT=1 bash ./scripts/evaluate-lertiva-zip-p0-gate.sh bench-report-windows.json bench-report-windows-fast.json vitrin-lertiva-zip-p0-gate.json

      - name: Vitrin KPI snippet (artifact)
        shell: pwsh
        run: |
          function Export-VitrinKpi($in, $out, $disclaimer) {
            $raw = [System.IO.File]::ReadAllText($in).Trim()
            $s = $raw.Substring($raw.IndexOf('{'), $raw.LastIndexOf('}') - $raw.IndexOf('{') + 1) | ConvertFrom-Json
            [ordered]@{
              profile = $s.profile; platform = $s.platform; generated_at = $s.generated_at
              source = 'windows-official-ci'; disclaimer = $disclaimer; kpi = $s.kpi
            } | ConvertTo-Json -Depth 12 | Set-Content -Path $out -Encoding utf8NoBOM
          }
          Export-VitrinKpi 'bench-report-windows.json' 'vitrin-windows-balanced-kpi.json' 'Resmi Faz 3 kapı.'
          Export-VitrinKpi 'bench-report-windows-fast.json' 'vitrin-windows-fast-kpi.json' 'Resmi hız kapısı.'
          function Export-VitrinZipKpi($in, $out, $disclaimer) {
            $raw = [System.IO.File]::ReadAllText($in).Trim()
            $s = $raw.Substring($raw.IndexOf('{'), $raw.LastIndexOf('}') - $raw.IndexOf('{') + 1) | ConvertFrom-Json
            [ordered]@{
              product = 'Lertiva Zip'; profile = $s.profile; platform = $s.platform; generated_at = $s.generated_at
              source = 'windows-official-ci'; disclaimer = $disclaimer; kpi = $s.zip_kpi
            } | ConvertTo-Json -Depth 12 | Set-Content -Path $out -Encoding utf8NoBOM
          }
          Export-VitrinZipKpi 'bench-report-windows.json' 'vitrin-lertiva-zip-balanced-kpi.json' 'Lertiva Zip ZIP satırı (7-Zip / WinZip / WinRAR-ZIP).'
          Export-VitrinZipKpi 'bench-report-windows-fast.json' 'vitrin-lertiva-zip-fast-kpi.json' 'Lertiva Zip hız KPI (Fast).'

      - name: Vitrin import komutu (özet)
        shell: bash
        run: |
          {
            echo "### Windows KPI → vitrin"
            echo '```bash'
            echo "bash scripts/import-windows-kpi-to-vitrin.sh bench-report-windows.json bench-report-windows-fast.json"
            echo "git add apps/web/public/benchmark/samples/windows-*.json && git commit -m 'chore(vitrin): Windows KPI' && git push"
            echo '```'
            echo "Bkz. docs/WINLRTRAR_POST_MERGE.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-windows
          path: |
            bench-report-windows.json
            BENCH_REPORT.md
            bench-report-windows-fast.json
            BENCH_REPORT_FAST.md
            vitrin-windows-balanced-kpi.json
            vitrin-windows-fast-kpi.json
            vitrin-lertiva-zip-balanced-kpi.json
            vitrin-lertiva-zip-fast-kpi.json
            vitrin-lertiva-zip-p0-gate.json
          if-no-files-found: error
