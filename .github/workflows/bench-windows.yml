name: winlrt Windows benchmark (resmi)

on:
  workflow_dispatch:
    inputs:
      kpi_strict:
        description: KPI kapısı geçmezse job başarısız (Faz 3 kapı doğrulama)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crates/winlrt-archive/**"
      - "benchmarks/**"
      - ".github/workflows/bench-windows.yml"

jobs:
  bench-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/winlrt-archive

      - name: Install 7-Zip (rakip referans)
        run: choco install 7zip -y

      - name: Install WinRAR (rakip referans, deneme)
        continue-on-error: true
        run: choco install winrar -y

      - name: Build winlrt-archive
        run: cargo build -p winlrt-archive --release

      - name: Prepare mixed benchmark fixture (~10 MiB)
        shell: bash
        run: bash benchmarks/fixtures/mixed/prepare.sh

      - name: Benchmark (winlrt + 7-Zip + WinRAR ZIP)
        env:
          WINLRT_BENCH_INCLUDE_7Z: "1"
          WINLRT_BENCH_INCLUDE_WINRAR: "1"
        shell: pwsh
        run: |
          function Write-BenchJson {
            param([string[]]$CargoArgs, [string]$OutPath)
            cargo run -p winlrt-archive --release -- @CargoArgs 2>$null | Set-Content -Path $OutPath -Encoding utf8NoBOM
          }
          function Write-BenchMd {
            param([string[]]$CargoArgs, [string]$OutPath)
            cargo run -p winlrt-archive --release -- @CargoArgs 2>$null | Set-Content -Path $OutPath -Encoding utf8
          }
          Write-BenchJson -CargoArgs @('bench','--all','--json') -OutPath 'bench-report-windows.json'
          Write-BenchMd -CargoArgs @('bench','--all','--markdown') -OutPath 'BENCH_REPORT.md'
          Write-BenchJson -CargoArgs @('bench','--all','--profile','fast','--json') -OutPath 'bench-report-windows-fast.json'
          Write-BenchMd -CargoArgs @('bench','--all','--profile','fast','--markdown') -OutPath 'BENCH_REPORT_FAST.md'

      - name: KPI özeti (Balanced + Fast)
        shell: pwsh
        env:
          WINLRT_KPI_STRICT: ${{ (vars.WINLRT_KPI_STRICT == '1' || (github.event_name == 'workflow_dispatch' && inputs.kpi_strict == true)) && '1' || '0' }}
        run: |
          ./scripts/evaluate-bench-kpi.ps1 -JsonPath bench-report-windows.json
          ./scripts/evaluate-bench-kpi.ps1 -JsonPath bench-report-windows-fast.json

      - name: Vitrin KPI snippet (artifact)
        shell: bash
        run: |
          sudo apt-get install -y -qq jq
          jq '{profile, platform, generated_at, source: "windows-official-ci", disclaimer: "Resmi Faz 3 kapı.", kpi}' \
            bench-report-windows.json > vitrin-windows-balanced-kpi.json
          jq '{profile, platform, generated_at, source: "windows-official-ci", disclaimer: "Resmi hız kapısı.", kpi}' \
            bench-report-windows-fast.json > vitrin-windows-fast-kpi.json

      - name: Vitrin import komutu (özet)
        shell: bash
        run: |
          {
            echo "### Windows KPI → vitrin"
            echo '```bash'
            echo "bash scripts/import-windows-kpi-to-vitrin.sh bench-report-windows.json bench-report-windows-fast.json"
            echo "git add apps/web/public/benchmark/samples/windows-*.json && git commit -m 'chore(vitrin): Windows KPI' && git push"
            echo '```'
            echo "Bkz. docs/WINLRTRAR_POST_MERGE.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-windows
          path: |
            bench-report-windows.json
            BENCH_REPORT.md
            bench-report-windows-fast.json
            BENCH_REPORT_FAST.md
            vitrin-windows-balanced-kpi.json
            vitrin-windows-fast-kpi.json
          if-no-files-found: error
