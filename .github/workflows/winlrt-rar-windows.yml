name: winlrtRAR Windows beta build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Build winlrtRAR (Tauri + libunrar)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @winlrt/rar -- --features unrar-embedded

      - name: Upload Windows bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: winlrt-rar-windows-bundle
          path: |
            apps/winlrt-rar/src-tauri/target/release/bundle/**/*.exe
            apps/winlrt-rar/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

      - name: GitHub Release (beta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winlrt-rar-beta.${{ github.run_number }}
          name: winlrtRAR Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            apps/winlrt-rar/src-tauri/target/release/bundle/**/*.exe
            apps/winlrt-rar/src-tauri/target/release/bundle/**/*.msi
