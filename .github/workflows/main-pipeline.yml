name: Main pipeline

# main push: CI + (secrets varsa) otomatik vitrin deploy + VPS yedek
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# main: hızlı push'larda iptal etme (Madde B %100). PR: eski koşuyu iptal et.
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vitrin
        run: npm run build:web

      - name: Vitrin ↔ repo metin senkronu
        run: bash scripts/verify-vitrin-sync.sh

      - name: Dalga 2/3 repo smoke
        run: bash scripts/run-dalga-smoke.sh

      - name: Agent completion batch (Linux)
        run: |
          chmod +x scripts/run-agent-completion-batch.sh
          bash scripts/run-agent-completion-batch.sh

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lertiva-archive

      - name: Test and build lertiva-archive
        run: cargo test -p lertiva-archive && cargo build -p lertiva-archive --release --bins

      - name: Linux deps (Lertiva Arc Tauri check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check Lertiva Arc Tauri shell
        run: cargo check -p lertiva-arc

      - name: Check Lertiva Zip Tauri shell
        run: cargo check -p lertiva-zip

      - name: Prepare mixed benchmark fixture (~10 MiB)
        run: bash benchmarks/fixtures/mixed/prepare.sh

      - name: Lertiva Zip e-posta profili (I6 / W7)
        run: cargo test -p lertiva-archive --test lertiva_zip_interop i6_email_profile_mixed -- --ignored

      - name: Lertiva Zip AES interop (I4 / W8)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y -qq -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold p7zip-full
          cargo test -p lertiva-archive --test lertiva_zip_interop i4_

      - name: Lertiva Zip UTF-8 dosya adları (I5 / W9)
        run: |
          cargo test -p lertiva-archive --lib zip_turkish_utf8
          cargo test -p lertiva-archive --test lertiva_zip_interop i5_

      - name: Lertiva Zip ZIP64 (I3 / W10)
        run: |
          cargo test -p lertiva-archive zip64_smoke
          cargo test -p lertiva-archive --test lertiva_zip_interop i3_

      - name: Lertiva Zip bozuk CRC (I7 / W11)
        run: |
          cargo test -p lertiva-archive zip_corrupt_crc
          cargo test -p lertiva-archive --test lertiva_zip_interop i7_

      - name: Lertiva Zip Explorer interop proxy (I1/I2 / W12)
        run: |
          sudo apt-get install -y -qq zip unzip
          cargo test -p lertiva-archive --test lertiva_zip_interop i1_
          cargo test -p lertiva-archive --test lertiva_zip_interop i2_

      - name: Lertiva Zip KOBİ pilot proxy (W13)
        run: cargo test -p lertiva-archive --test lertiva_zip_interop kobi_

      - name: Lertiva Zip macOS kapı (W14)
        run: bash scripts/verify-madde-w14.sh

      - name: Lertiva Zip geçiş + macOS KPI vitrin (W15)
        run: bash scripts/verify-madde-w15.sh

      - name: Lertiva Zip P0×3 kapı scriptleri (W16)
        run: bash scripts/verify-madde-w16.sh

      - name: Lertiva Zip Windows KPI vitrin import (W17)
        run: bash scripts/verify-madde-w17.sh

      - name: Lertiva Zip kurumsal GPO + audit (W18)
        run: bash scripts/verify-madde-w18.sh

      - name: Lertiva Zip kurumsal pilot signoff kapısı (W19)
        run: bash scripts/verify-madde-w19.sh

      - name: Lertiva Zip Split ZIP smoke (W20)
        run: bash scripts/verify-madde-w20.sh

      - name: Lertiva Zip Split ZIP birleştirme (W21)
        run: bash scripts/verify-madde-w21.sh

      - name: Lertiva Zip Split ZIP yazma (W22)
        run: bash scripts/verify-madde-w22.sh

      - name: Lertiva Zip imzalı arşiv (W23)
        run: bash scripts/verify-madde-w23.sh

      - name: Lertiva Zip Info-ZIP span (W24)
        run: bash scripts/verify-madde-w24.sh

      - name: Lertiva Zip güvenli paylaşım KVKK (W25)
        run: bash scripts/verify-madde-w25.sh

      - name: Lertiva Zip mobil okuyucu smoke (W26)
        run: bash scripts/verify-madde-w26.sh

      - name: Lertiva Zip mağaza kapısı (W27)
        run: bash scripts/verify-madde-w27.sh

      - name: Lertiva Zip Lerta posta eki (W28)
        run: bash scripts/verify-madde-w28.sh

      - name: Lertiva Zip Lerta üretim API (W29)
        run: bash scripts/verify-madde-w29.sh

      - name: Lertiva Zip Lerta mesaj eki (W30)
        run: bash scripts/verify-madde-w30.sh

      - name: Lertiva Zip Lerta birleşik staging (W31)
        run: bash scripts/verify-madde-w31.sh

      - name: Lertiva Zip mağaza/mobil pilot hazırlık (W32)
        run: bash scripts/verify-madde-w32.sh

      - name: Lertiva marka kalıntı taraması
        run: bash scripts/verify-lertiva-brand.sh

      - name: Lertiva dev kod imzası (self-signed altyapı)
        run: bash scripts/verify-lertiva-dev-codesign.sh

      - name: Faz 1 benchmark raporu
        run: |
          cargo run -p lertiva-archive --release -- bench --all --json > bench-report.json
          cargo run -p lertiva-archive --release -- bench --all --markdown > BENCH_REPORT.md
          cargo run -p lertiva-archive --release -- bench --all --json --zip-kpi > bench-zip-balanced.json
          cargo run -p lertiva-archive --release -- bench --all --profile fast --json --zip-kpi > bench-zip-fast.json

      - name: Lertiva Zip P0×3 KPI kapısı (W16)
        env:
          WINLRT_ZIP_KPI_STRICT: ${{ vars.WINLRT_KPI_STRICT == '1' && '1' || '0' }}
        run: |
          command -v jq >/dev/null || sudo apt-get install -y -qq jq
          chmod +x scripts/evaluate-lertiva-zip-p0-gate.sh
          ./scripts/evaluate-lertiva-zip-p0-gate.sh bench-zip-balanced.json bench-zip-fast.json

      - name: KPI özeti (Linux Balanced, Madde C strict)
        env:
          WINLRT_KPI_STRICT: ${{ (vars.WINLRT_KPI_STRICT == '1' || github.ref == 'refs/heads/main') && '1' || '0' }}
        run: |
          command -v jq >/dev/null || sudo apt-get install -y -qq jq
          chmod +x scripts/evaluate-bench-kpi.sh
          ./scripts/evaluate-bench-kpi.sh bench-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            bench-report.json
            BENCH_REPORT.md
          if-no-files-found: error

  deploy:
    needs: web
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Skip deploy when VPS secrets missing
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS secrets yok — deploy atlandı (bkz. docs/AUTO_DEPLOY.md)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "20"
          cache: npm

      - name: Build vitrin for deploy
        if: steps.check.outputs.skip == 'false'
        run: npm ci && npm run build:web

      - name: Prepare deploy auth (SSH key or password)
        if: steps.check.outputs.skip == 'false'
        env:
          RAW_KEY: ${{ secrets.VPS_SSH_KEY }}
          B64_KEY: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/vps_deploy_key"

          key_ok() {
            [ -f "$1" ] && chmod 600 "$1" && ssh-keygen -y -f "$1" >/dev/null 2>&1
          }

          if [ -n "${B64_KEY}" ]; then
            printf '%s' "${B64_KEY}" | tr -d '[:space:]' | base64 -d >"${KEY_FILE}"
          elif [ -n "${RAW_KEY}" ]; then
            printf '%s' "${RAW_KEY}" | sed 's/\r$//g' >"${KEY_FILE}"
            if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' "${KEY_FILE}"; then
              printf '%s' "${RAW_KEY}" | sed 's/\\n/\n/g' | sed 's/\r$//g' >"${KEY_FILE}"
            fi
          fi

          if key_ok "${KEY_FILE}"; then
            echo "auth=key" >>"${GITHUB_OUTPUT}"
            echo "key_file=${KEY_FILE}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -n "${RAW_KEY}" ] || [ -n "${B64_KEY}" ]; then
            echo "::warning::GitHub VPS_SSH_KEY / VPS_SSH_KEY_B64 geçersiz (libcrypto)"
          fi

          if [ -n "${VPS_PASSWORD}" ]; then
            echo "auth=password" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::SSH anahtarı yok/geçersiz ve VPS_SSH_PASSWORD tanımlı değil."
          echo "::error::VPS'e bir kez: bkz. .github/deploy/README.md (authorized_keys satırı)"
          echo "auth=skip" >>"${GITHUB_OUTPUT}"
          echo "::notice::CI deploy atlandı — VPS cron winlrt-vitrin-sync (Madde E/F). Agent: post-phase-deploy.sh"
          exit 0
        id: sshkey

      - name: Backup current site on VPS
        if: steps.check.outputs.skip == 'false' && (steps.sshkey.outputs.auth == 'key' || steps.sshkey.outputs.auth == 'password')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ steps.sshkey.outputs.auth == 'key' && steps.sshkey.outputs.key_file || '' }}
          password: ${{ steps.sshkey.outputs.auth == 'password' && secrets.VPS_SSH_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            WEB_ROOT="${{ secrets.VPS_WEB_ROOT }}"
            BACKUP_BASE="/var/backups/winlrt/web-dist"
            mkdir -p "$BACKUP_BASE"
            if [ -d "$WEB_ROOT" ] && [ "$(ls -A "$WEB_ROOT" 2>/dev/null || true)" ]; then
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}"
              STAMP="${STAMP:0:48}"
              DEST="$BACKUP_BASE/$STAMP"
              cp -a "$WEB_ROOT" "$DEST"
              echo "Yedek: $DEST"
              ls -dt "$BACKUP_BASE"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            else
              echo "Yedeklenecek dist yok (ilk deploy)"
            fi

      - name: Deploy dist to VPS
        if: steps.check.outputs.skip == 'false' && (steps.sshkey.outputs.auth == 'key' || steps.sshkey.outputs.auth == 'password')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          VPS_WEB_ROOT: ${{ secrets.VPS_WEB_ROOT }}
          KEY_FILE: ${{ steps.sshkey.outputs.auth == 'key' && steps.sshkey.outputs.key_file || '' }}
          VPS_PASSWORD: ${{ steps.sshkey.outputs.auth == 'password' && secrets.VPS_SSH_PASSWORD || '' }}
        run: |
          set -euo pipefail
          SSH_BASE=(ssh -o StrictHostKeyChecking=accept-new -p "${VPS_PORT}")
          if [ -n "${KEY_FILE}" ]; then
            SSH_BASE+=(-i "${KEY_FILE}")
          elif [ -n "${VPS_PASSWORD}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            SSH_BASE=(sshpass -p "${VPS_PASSWORD}" "${SSH_BASE[@]}")
          else
            echo "::error::Deploy için anahtar veya şifre yok"
            exit 1
          fi
          "${SSH_BASE[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${VPS_WEB_ROOT}'"
          rsync -av --delete -e "${SSH_BASE[*]}" apps/web/dist/ "${VPS_USER}@${VPS_HOST}:${VPS_WEB_ROOT}/"

      - name: Reload nginx
        if: steps.check.outputs.skip == 'false' && (steps.sshkey.outputs.auth == 'key' || steps.sshkey.outputs.auth == 'password')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ steps.sshkey.outputs.auth == 'key' && steps.sshkey.outputs.key_file || '' }}
          password: ${{ steps.sshkey.outputs.auth == 'password' && secrets.VPS_SSH_PASSWORD || '' }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
          script: |
            if command -v nginx >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                nginx -t && systemctl reload nginx
              else
                sudo nginx -t && sudo systemctl reload nginx
              fi
            fi
