name: Lertiva Arc Windows ARM64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (ör. v1.0.2) — boşsa yalnızca artifact
        required: false
        default: ""
  push:
    branches: [main]
    tags:
      - "v1.0.*"
    paths:
      - .github/flags/trigger-arc-arm64-build
      - .github/workflows/lertiva-arc-windows-arm64.yml

permissions:
  contents: write

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build Lertiva Arc ARM64 (Tauri NSIS)
        id: build
        shell: bash
        run: |
          set -uo pipefail
          TARGET=aarch64-pc-windows-msvc
          if npm run tauri build -w @lertiva/arc -- --target "$TARGET" --features unrar-embedded --bundles nsis; then
            echo "unrar_embedded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::unrar-embedded ARM64 derlenemedi — RAR gömülü olmadan yeniden deneniyor"
            npm run tauri build -w @lertiva/arc -- --target "$TARGET" --bundles nsis
            echo "unrar_embedded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticode imza (secret varsa)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/sign-windows-nsis-bundle.ps1 -Glob "target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe"

      - name: Kurulum adı (arm64)
        id: name
        shell: pwsh
        run: |
          $dir = "target/aarch64-pc-windows-msvc/release/bundle/nsis"
          $setup = Get-ChildItem -Path $dir -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'ARM64 NSIS setup.exe yok' }
          $conf = Get-Content apps/lertiva-arc/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $want = "Lertiva Arc_$($conf.version)_arm64-setup.exe"
          $dest = Join-Path $setup.DirectoryName $want
          if ($setup.FullName -ne $dest) { Move-Item -Force -Path $setup.FullName -Destination $dest }
          "file=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $dest"

      - name: PE mimarisi (ARM64 doğrulama)
        shell: pwsh
        run: |
          $f = "${{ steps.name.outputs.file }}"
          $exe = Get-ChildItem "target/aarch64-pc-windows-msvc/release/*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw 'Uygulama exe yok' }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("Machine=0x{0:X4} ({1})" -f $machine, $exe.Name)
          if ($machine -ne 0xAA64) { throw "ARM64 değil (0x$('{0:X4}' -f $machine))" }

      - name: Upload ARM64 bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lertiva-arc-windows-arm64-bundle
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*_arm64-setup.exe
          if-no-files-found: error

      - name: Release asset (tag)
        if: startsWith(github.ref, 'refs/tags/v1.0.') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: target/aarch64-pc-windows-msvc/release/bundle/nsis/*_arm64-setup.exe
