name: Lertiva Arc Windows beta build

on:
  workflow_dispatch:
    inputs:
      skip_release:
        description: Yalnızca artifact yükle (GitHub Release oluşturma)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/flags/trigger-beta-build
      - .github/flags/trigger-beta-release
      - .github/workflows/lertiva-arc-windows.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Lertiva Arc (Tauri + libunrar)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -w @lertiva/rar -- --features unrar-embedded --bundles nsis

      - name: İmza durumu
        id: signing
        shell: bash
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY tanımlı değil — kurulum imzasız; SmartScreen uyarısı beklenir."
            echo "Bkz. docs/WINLRTRAR_CODE_SIGNING.md"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Authenticode (imza secret tanımlıysa)
        if: steps.signing.outputs.present == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1

      - name: Bundle yolu (workspace target)
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find target/release/bundle -name '*-setup.exe' -type f 2>/dev/null | head -1)"
          if [ -z "${EXE}" ]; then
            echo "::error::NSIS setup.exe bulunamadı (target/release/bundle)"
            exit 1
          fi
          echo "exe=${EXE}" >> "$GITHUB_OUTPUT"
          echo "NSIS: ${EXE}"

      - name: Upload Windows bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: winlrt-rar-windows-bundle
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Release modu (push flag)
        id: rel
        if: github.event_name == 'push'
        shell: bash
        run: |
          FILES="$(git show --pretty='' --name-only HEAD || true)"
          if echo "${FILES}" | tr '\\' '/' | grep -q 'trigger-beta-release'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release (beta)
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.skip_release != true) ||
          (github.event_name == 'push' && steps.rel.outputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winlrt-rar-beta.${{ github.run_number }}
          name: Lertiva Arc Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: target/release/bundle/nsis/*-setup.exe
